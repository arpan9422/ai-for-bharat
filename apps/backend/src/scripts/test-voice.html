<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voice Pipeline Test — STT → LLM → TTS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f13;
      color: #e2e2e2;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 6px; color: #fff; }
    p.sub { font-size: 0.85rem; color: #888; margin-bottom: 32px; }

    .card {
      background: #1a1a22;
      border: 1px solid #2a2a35;
      border-radius: 14px;
      padding: 28px;
      width: 100%;
      max-width: 560px;
      margin-bottom: 20px;
    }

    /* Mic button */
    #micBtn {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: none;
      background: #3b5bdb;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 4px 20px rgba(59,91,219,0.4);
    }
    #micBtn:hover  { background: #4c6ef5; }
    #micBtn.active { background: #e03131; box-shadow: 0 4px 20px rgba(224,49,49,0.5); animation: pulse 1.2s infinite; }
    #micBtn:disabled { background: #444; cursor: not-allowed; box-shadow: none; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.08); }
    }

    #status {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 20px;
      min-height: 20px;
    }
    #status.thinking { color: #f59f00; }
    #status.speaking { color: #40c057; }
    #status.error    { color: #e03131; }

    /* Transcript log */
    .log-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: #555; margin-bottom: 10px; }

    #log {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.5;
      max-width: 90%;
    }
    .bubble.user      { background: #2c2c3a; align-self: flex-end; color: #c5c5ff; }
    .bubble.assistant { background: #1e3a2f; align-self: flex-start; color: #8ce99a; }
    .bubble.system    { background: #2a1f1f; align-self: center; color: #888; font-size: 0.78rem; font-style: italic; }

    /* Config row */
    .config-row {
      display: flex; gap: 12px; align-items: center;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .config-row label { font-size: 0.8rem; color: #888; }
    .config-row input {
      flex: 1; min-width: 180px;
      background: #12121a; border: 1px solid #2a2a35;
      color: #e2e2e2; border-radius: 8px;
      padding: 8px 12px; font-size: 0.85rem;
    }
    .config-row input:focus { outline: none; border-color: #3b5bdb; }

    /* Volume bar */
    #volBar {
      width: 100%; height: 4px;
      background: #2a2a35; border-radius: 2px;
      margin-bottom: 16px; overflow: hidden;
    }
    #volFill { height: 100%; width: 0%; background: #3b5bdb; transition: width 0.05s; }
  </style>
</head>
<body>

<h1>🎙 Voice Pipeline Test</h1>
<p class="sub">STT (Deepgram) → LLM → TTS (Sarvam) — end-to-end</p>

<div class="card">
  <div class="config-row">
    <label>Backend WS</label>
    <input id="wsUrl" value="ws://localhost:4000/ws/test-voice" />
  </div>

  <div id="volBar"><div id="volFill"></div></div>

  <button id="micBtn" title="Hold to talk">🎤</button>
  <div id="status">Click mic to start</div>
</div>

<div class="card">
  <div class="log-label">Conversation</div>
  <div id="log"></div>
</div>

<script>
  const micBtn   = document.getElementById('micBtn');
  const statusEl = document.getElementById('status');
  const logEl    = document.getElementById('log');
  const volFill  = document.getElementById('volFill');
  const wsUrlEl  = document.getElementById('wsUrl');

  let ws            = null;
  let mediaRecorder = null;
  let audioCtx      = null;
  let analyser      = null;
  let volInterval   = null;
  let mp3Queue      = [];
  let isPlaying     = false;
  let currentSource = null;  // currently playing AudioBufferSourceNode

  // ── Helpers ──────────────────────────────────────────────────────────────

  function setStatus(msg, cls = '') {
    statusEl.textContent = msg;
    statusEl.className = cls;
  }

  function addBubble(text, role) {
    const div = document.createElement('div');
    div.className = `bubble ${role}`;
    div.textContent = text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    return div;
  }

  // ── Audio playback (mp3 chunks → AudioContext) ────────────────────────────

  async function playChunk(base64mp3) {
    if (!audioCtx) audioCtx = new AudioContext();
    const buf = Uint8Array.from(atob(base64mp3), c => c.charCodeAt(0));
    const decoded = await audioCtx.decodeAudioData(buf.buffer);
    return new Promise(resolve => {
      const src = audioCtx.createBufferSource();
      src.buffer = decoded;
      src.connect(audioCtx.destination);
      src.onended = () => { currentSource = null; resolve(); };
      currentSource = src;
      src.start();
    });
  }

  async function drainQueue() {
    if (isPlaying) return;
    isPlaying = true;
    while (mp3Queue.length > 0) {
      const chunk = mp3Queue.shift();
      try { await playChunk(chunk); } catch(e) { console.warn('playChunk err', e); }
    }
    isPlaying = false;
  }

  // ── WebSocket ─────────────────────────────────────────────────────────────

  function connectWS() {
    return new Promise((resolve, reject) => {
      const socket = new WebSocket(wsUrlEl.value.trim());
      socket.onopen  = () => { ws = socket; setStatus('Connected — click mic to speak'); resolve(socket); };
      socket.onclose = () => { ws = null; setStatus('Disconnected', 'error'); };
      socket.onerror = () => { ws = null; reject(new Error('WS connection failed')); };

      socket.onmessage = async (evt) => {
        const msg = JSON.parse(evt.data);

        if (msg.type === 'TRANSCRIPT') {
          const existing = logEl.querySelector('.bubble.user.pending');
          if (existing) { existing.textContent = msg.payload; }
          else { const b = addBubble(msg.payload, 'user'); b.classList.add('pending'); }
          setStatus('Thinking…', 'thinking');
        }

        if (msg.type === 'AUDIO_PLAY') {
          const pending = logEl.querySelector('.bubble.user.pending');
          if (pending) pending.classList.remove('pending');
          setStatus('Speaking…', 'speaking');
          mp3Queue.push(msg.payload);
          drainQueue();
        }

        if (msg.type === 'TURN_DONE') {
          setStatus('Listening… (speak, then pause)');
        }

        if (msg.type === 'ERROR') {
          setStatus('Error: ' + msg.payload, 'error');
          addBubble('⚠ ' + msg.payload, 'system');
        }
      };
    });
  }

  // ── Microphone recording ──────────────────────────────────────────────────

  async function startRecording() {
    if (!audioCtx) audioCtx = new AudioContext();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    // Volume meter only
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);
    const dataArr = new Uint8Array(analyser.frequencyBinCount);
    volInterval = setInterval(() => {
      analyser.getByteFrequencyData(dataArr);
      const avg = dataArr.reduce((a, b) => a + b, 0) / dataArr.length;
      volFill.style.width = Math.min(avg * 2, 100) + '%';
    }, 50);

    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
    mediaRecorder.ondataavailable = async (e) => {
      if (e.data.size === 0 || !ws || ws.readyState !== WebSocket.OPEN) return;
      const ab = await e.data.arrayBuffer();
      const b64 = btoa(String.fromCharCode(...new Uint8Array(ab)));
      ws.send(JSON.stringify({ type: 'AUDIO_CHUNK', payload: b64 }));
    };
    mediaRecorder.start(100);

    micBtn.classList.add('active');
    setStatus('Listening… (Deepgram will detect when you stop speaking)');
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(t => t.stop());
    }
    clearInterval(volInterval);
    volFill.style.width = '0%';
    micBtn.classList.remove('active');
    setStatus('Stopped');
  }

  // ── Button events (click to toggle) ──────────────────────────────────────

  let recording = false;

  micBtn.addEventListener('click', async () => {
    if (!recording) {
      recording = true;
      micBtn.disabled = true;
      setStatus('Connecting…');
      try {
        if (!ws || ws.readyState !== WebSocket.OPEN) await connectWS();
        micBtn.disabled = false;
        await startRecording();
      } catch (err) {
        recording = false;
        micBtn.disabled = false;
        setStatus('Could not connect to server', 'error');
      }
    } else {
      recording = false;
      stopRecording();
    }
  });

  // Show idle status on load — no auto-connect
  setStatus('Click mic to start');
</script>
</body>
</html>
