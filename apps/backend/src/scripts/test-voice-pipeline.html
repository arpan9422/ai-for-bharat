<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rupeezy AI Voice Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .header-logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 14px; color: white;
    }
    .header-title { font-weight: 700; font-size: 15px; color: #f1f5f9; }
    .header-sub { font-size: 12px; color: #64748b; margin-top: 1px; }
    .header-badge {
      display: flex; align-items: center; gap: 6px;
      background: #1e2a1e; border: 1px solid #2d4a2d;
      color: #4ade80; font-size: 12px; font-weight: 600;
      padding: 5px 12px; border-radius: 20px;
    }
    .header-badge .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #4ade80; animation: blink 2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Layout ── */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── Left panel: config ── */
    .panel-left {
      width: 300px; min-width: 300px;
      background: #1a1d27;
      border-right: 1px solid #2d3148;
      padding: 20px;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 20px;
    }

    .section-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: #64748b; margin-bottom: 12px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 600;
      color: #94a3b8; margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%; padding: 9px 12px;
      background: #0f1117; border: 1px solid #2d3148;
      border-radius: 8px; color: #e2e8f0; font-size: 13px;
      transition: border-color 0.15s;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none; border-color: #6366f1;
    }
    .form-group select option { background: #1a1d27; }

    /* ── Call controls ── */
    .call-controls { display: flex; flex-direction: column; gap: 10px; }

    .btn {
      width: 100%; padding: 12px;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }
    .btn-start { background: linear-gradient(135deg, #10b981, #059669); color: white; }
    .btn-start:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(16,185,129,0.3); }
    .btn-end { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
    .btn-end:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(239,68,68,0.3); }

    /* ── Status indicator ── */
    .status-bar {
      padding: 10px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
      border: 1px solid;
    }
    .status-bar.disconnected { background: #1a1117; border-color: #3d1f1f; color: #f87171; }
    .status-bar.connected    { background: #0f1a14; border-color: #1a3d2a; color: #4ade80; }
    .status-bar.recording    { background: #0f1420; border-color: #1e2d5a; color: #60a5fa; animation: pulse-bg 2s infinite; }
    @keyframes pulse-bg { 0%,100%{opacity:1} 50%{opacity:0.7} }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .disconnected .status-dot { background: #ef4444; }
    .connected .status-dot    { background: #4ade80; }
    .recording .status-dot    { background: #60a5fa; animation: blink 1s infinite; }

    /* ── Score display ── */
    .score-display {
      background: #0f1117; border: 1px solid #2d3148;
      border-radius: 12px; padding: 16px; text-align: center;
    }
    .score-value { font-size: 40px; font-weight: 900; line-height: 1; }
    .score-label { font-size: 11px; color: #64748b; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
    .score-status { font-size: 12px; font-weight: 700; margin-top: 6px; }
    .score-hot  { color: #f87171; }
    .score-warm { color: #fbbf24; }
    .score-cold { color: #60a5fa; }

    /* ── Right panel: conversation ── */
    .panel-right {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* ── Conversation area ── */
    .conversation {
      flex: 1; overflow-y: auto; padding: 20px;
      display: flex; flex-direction: column; gap: 12px;
    }

    .msg {
      display: flex; gap: 10px; max-width: 75%;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }

    .msg.agent { align-self: flex-start; }
    .msg.user  { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; flex-shrink: 0;
    }
    .msg.agent .msg-avatar { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
    .msg.user  .msg-avatar { background: #2d3148; color: #94a3b8; }

    .msg-bubble {
      padding: 10px 14px; border-radius: 14px;
      font-size: 14px; line-height: 1.55;
    }
    .msg.agent .msg-bubble {
      background: #1e2235; border: 1px solid #2d3148;
      border-top-left-radius: 4px; color: #e2e8f0;
    }
    .msg.user .msg-bubble {
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      border-top-right-radius: 4px; color: white;
    }

    .msg-time { font-size: 10px; color: #475569; margin-top: 4px; }
    .msg.user .msg-time { text-align: right; }

    /* System messages */
    .sys-msg {
      text-align: center; font-size: 11px; color: #475569;
      padding: 4px 12px; background: #1a1d27;
      border-radius: 20px; align-self: center;
      border: 1px solid #2d3148;
    }

    /* ── Bottom bar ── */
    .bottom-bar {
      background: #1a1d27; border-top: 1px solid #2d3148;
      padding: 12px 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .mic-indicator {
      display: flex; align-items: center; gap-6px;
      font-size: 12px; color: #64748b;
    }
    .mic-wave {
      display: flex; align-items: center; gap: 2px; height: 20px;
    }
    .mic-wave span {
      display: block; width: 3px; background: #6366f1;
      border-radius: 2px; animation: wave 1s ease-in-out infinite;
    }
    .mic-wave span:nth-child(1) { height: 6px; animation-delay: 0s; }
    .mic-wave span:nth-child(2) { height: 14px; animation-delay: 0.1s; }
    .mic-wave span:nth-child(3) { height: 10px; animation-delay: 0.2s; }
    .mic-wave span:nth-child(4) { height: 18px; animation-delay: 0.3s; }
    .mic-wave span:nth-child(5) { height: 8px; animation-delay: 0.4s; }
    .mic-wave.inactive span { background: #2d3148; animation: none; height: 6px; }
    @keyframes wave { 0%,100%{transform:scaleY(0.5)} 50%{transform:scaleY(1)} }

    .bottom-info { font-size: 11px; color: #475569; margin-left: auto; }

    /* ── Summary panel ── */
    .summary-panel {
      background: #1a1d27; border-top: 1px solid #2d3148;
      padding: 16px 20px; display: none;
    }
    .summary-panel.visible { display: block; }
    .summary-title { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .summary-item { background: #0f1117; border: 1px solid #2d3148; border-radius: 10px; padding: 12px; }
    .summary-item-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .summary-item-value { font-size: 13px; color: #e2e8f0; font-weight: 600; line-height: 1.4; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 3px; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-brand">
    <div class="header-logo">R</div>
    <div>
      <div class="header-title">Rupeezy AI Voice Agent</div>
      <div class="header-sub">Partner Lead Conversion — Test Interface</div>
    </div>
  </div>
  <div class="header-badge">
    <div class="dot"></div>
    AI Agent Live
  </div>
</div>

<!-- Main -->
<div class="main">

  <!-- Left panel -->
  <div class="panel-left">

    <!-- Status -->
    <div>
      <div class="section-title">Connection</div>
      <div id="status" class="status-bar disconnected">
        <div class="status-dot"></div>
        <span id="statusText">Disconnected</span>
      </div>
    </div>

    <!-- Lead profile -->
    <div>
      <div class="section-title">Lead Profile</div>
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="leadName" placeholder="Rajesh Kumar">
      </div>
      <div class="form-group">
        <label>Lead ID</label>
        <input type="text" id="leadId" placeholder="lead-12345">
      </div>
      <div class="form-group">
        <label>Occupation</label>
        <select id="leadOccupation">
          <option value="">Select...</option>
          <option value="MFD">MFD</option>
          <option value="distributor">Distributor</option>
          <option value="insurance agent">Insurance Agent</option>
          <option value="sub-broker">Sub-Broker</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Language</label>
        <select id="leadLanguage">
          <option value="hinglish">Hinglish</option>
          <option value="hindi">Hindi</option>
          <option value="english">English</option>
        </select>
      </div>
      <div class="form-group">
        <label>Background</label>
        <input type="text" id="leadBackground" placeholder="Financial services, 5 years">
      </div>
    </div>

    <!-- Controls -->
    <div>
      <div class="section-title">Controls</div>
      <div class="call-controls">
        <button class="btn btn-start" id="startCall">📞 Start Call</button>
        <button class="btn btn-end" id="endCall" disabled>📴 End Call</button>
      </div>
    </div>

    <!-- Score -->
    <div>
      <div class="section-title">Lead Score</div>
      <div class="score-display">
        <div class="score-value score-cold" id="scoreValue">—</div>
        <div class="score-label">Engagement Score</div>
        <div class="score-status" id="scoreStatus">Waiting...</div>
      </div>
    </div>

  </div>

  <!-- Right panel -->
  <div class="panel-right">

    <!-- Conversation -->
    <div class="conversation" id="conversation">
      <div class="sys-msg">Start a call to begin the conversation</div>
    </div>

    <!-- Summary panel (shown after call ends) -->
    <div class="summary-panel" id="summaryPanel">
      <div class="summary-title">📊 Call Summary</div>
      <div class="summary-grid" id="summaryGrid"></div>
    </div>

    <!-- Bottom bar -->
    <div class="bottom-bar">
      <div class="mic-wave inactive" id="micWave">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <span id="micLabel" style="font-size:12px;color:#475569">Microphone inactive</span>
      <div class="bottom-info">ws://localhost:4000/ws/voice-pipeline</div>
    </div>

  </div>
</div>

<script>
  let ws = null;
  let mediaRecorder = null;
  let mediaStream = null;
  let callActive = false;

  // Audio queue
  const audioQueue = [];
  let audioPlaying = false;

  function enqueueAudio(data, mime) {
    audioQueue.push({ data, mime });
    drainQueue();
  }

  function drainQueue() {
    if (audioPlaying || audioQueue.length === 0) return;
    audioPlaying = true;
    const { data, mime } = audioQueue.shift();
    const blob = new Blob([data], { type: mime });
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.onended = () => { URL.revokeObjectURL(url); audioPlaying = false; drainQueue(); };
    audio.onerror = () => { URL.revokeObjectURL(url); audioPlaying = false; drainQueue(); };
    audio.play().catch(() => { audioPlaying = false; drainQueue(); });
  }

  // DOM refs
  const statusEl    = document.getElementById('status');
  const statusText  = document.getElementById('statusText');
  const conv        = document.getElementById('conversation');
  const startBtn    = document.getElementById('startCall');
  const endBtn      = document.getElementById('endCall');
  const scoreVal    = document.getElementById('scoreValue');
  const scoreStat   = document.getElementById('scoreStatus');
  const micWave     = document.getElementById('micWave');
  const micLabel    = document.getElementById('micLabel');
  const summaryPanel = document.getElementById('summaryPanel');
  const summaryGrid  = document.getElementById('summaryGrid');

  function setStatus(text, cls) {
    statusEl.className = 'status-bar ' + cls;
    statusText.textContent = text;
  }

  function addMsg(content, role) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'agent' ? 'P' : 'L';
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = content;
    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    const inner = document.createElement('div');
    inner.appendChild(bubble);
    inner.appendChild(time);
    wrap.appendChild(avatar);
    wrap.appendChild(inner);
    conv.appendChild(wrap);
    conv.scrollTop = conv.scrollHeight;
  }

  function addSys(text) {
    const el = document.createElement('div');
    el.className = 'sys-msg';
    el.textContent = text;
    conv.appendChild(el);
    conv.scrollTop = conv.scrollHeight;
  }

  function updateScore(score) {
    scoreVal.textContent = score;
    scoreVal.className = 'score-value ' + (score >= 75 ? 'score-hot' : score >= 45 ? 'score-warm' : 'score-cold');
    scoreStat.textContent = score >= 75 ? '🔥 HOT' : score >= 45 ? '🌡️ WARM' : '❄️ COLD';
    scoreStat.className = 'score-status ' + (score >= 75 ? 'score-hot' : score >= 45 ? 'score-warm' : 'score-cold');
  }

  function setMic(active) {
    micWave.className = 'mic-wave' + (active ? '' : ' inactive');
    micLabel.textContent = active ? 'Listening...' : 'Microphone inactive';
  }

  function getLeadProfile() {
    const leadId = document.getElementById('leadId').value.trim();
    const name = document.getElementById('leadName').value.trim();
    const occupation = document.getElementById('leadOccupation').value;
    const language = document.getElementById('leadLanguage').value;
    const background = document.getElementById('leadBackground').value.trim();
    const profile = {
      lead_id: leadId || undefined,
      name: name || undefined,
      occupation: occupation || undefined,
      language: language || undefined,
      background: background || undefined,
    };
    if (!leadId && !name && !occupation && !background) return { profile: null, lead_id: null };
    return { profile, lead_id: leadId || null };
  }

  async function startRecording() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'audio/webm;codecs=opus' });
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
          const reader = new FileReader();
          reader.onload = () => {
            const b64 = btoa(String.fromCharCode(...new Uint8Array(reader.result)));
            ws.send(JSON.stringify({ type: 'AUDIO_CHUNK', payload: b64 }));
          };
          reader.readAsArrayBuffer(e.data);
        }
      };
      mediaRecorder.start(100);
      setMic(true);
      setStatus('🔴 Recording — speak now', 'recording');
    } catch (e) {
      addSys('❌ Microphone error: ' + e.message);
    }
  }

  function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    setMic(false);
  }

  function showSummary(s) {
    summaryGrid.innerHTML = '';
    const items = [
      { label: 'Status', value: s.status || '—' },
      { label: 'Next Action', value: s.nextAction || '—' },
      { label: 'Stated Intent', value: s.statedIntent ? `"${s.statedIntent}"` : 'None' },
      { label: 'Objections', value: (s.objectionsRaised || []).join(', ') || 'None' },
      { label: 'RM Opener', value: s.rmOpener || '—' },
    ];
    if (s.keyPoints && s.keyPoints.length > 0) {
      items.push({ label: 'Key Points', value: s.keyPoints.map(p => '• ' + p).join('\n') });
    }
    items.forEach(({ label, value }) => {
      const el = document.createElement('div');
      el.className = 'summary-item';
      el.innerHTML = `<div class="summary-item-label">${label}</div><div class="summary-item-value">${value}</div>`;
      summaryGrid.appendChild(el);
    });
    summaryPanel.className = 'summary-panel visible';
  }

  startBtn.addEventListener('click', async () => {
    summaryPanel.className = 'summary-panel';
    conv.innerHTML = '';
    audioQueue.length = 0;
    audioPlaying = false;
    scoreVal.textContent = '—';
    scoreStat.textContent = 'Waiting...';

    setStatus('Connecting...', 'connected');
    ws = new WebSocket('ws://localhost:4000/ws/voice-pipeline');

    ws.onopen = () => {
      setStatus('🟢 Connected', 'connected');
      const { profile, lead_id } = getLeadProfile();
      const payload = {};
      if (profile) payload.leadProfile = profile;
      if (lead_id) payload.lead_id = lead_id;
      ws.send(JSON.stringify({ type: 'START_CALL', payload }));
      callActive = true;
      startBtn.disabled = true;
      endBtn.disabled = false;
    };

    ws.onmessage = async (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === 'GREETING') {
        addMsg(msg.payload, 'agent');
        if (!mediaRecorder || mediaRecorder.state !== 'recording') await startRecording();
      }
      else if (msg.type === 'TRANSCRIPT') {
        // Show interim transcript as user bubble (update last if pending)
        const last = conv.querySelector('.msg.user:last-child .msg-bubble');
        if (last && last.dataset.pending) {
          last.textContent = msg.payload;
        } else {
          const wrap = document.createElement('div');
          wrap.className = 'msg user';
          const avatar = document.createElement('div');
          avatar.className = 'msg-avatar';
          avatar.textContent = 'L';
          const bubble = document.createElement('div');
          bubble.className = 'msg-bubble';
          bubble.textContent = msg.payload;
          bubble.dataset.pending = '1';
          const inner = document.createElement('div');
          inner.appendChild(bubble);
          wrap.appendChild(avatar);
          wrap.appendChild(inner);
          conv.appendChild(wrap);
          conv.scrollTop = conv.scrollHeight;
        }
      }
      else if (msg.type === 'FILLER_AUDIO') {
        const d = Uint8Array.from(atob(msg.payload), c => c.charCodeAt(0));
        enqueueAudio(d, 'audio/mpeg');
      }
      else if (msg.type === 'AUDIO_PLAY') {
        // Finalize pending transcript
        const pending = conv.querySelector('.msg-bubble[data-pending]');
        if (pending) delete pending.dataset.pending;
        const d = Uint8Array.from(atob(msg.payload), c => c.charCodeAt(0));
        enqueueAudio(d, 'audio/mpeg');
      }
      else if (msg.type === 'TURN_DONE') {
        // Add agent response bubble from last audio (we don't have text here — skip)
      }
      else if (msg.type === 'HANDOFF_REQUIRED') {
        addSys(`🚨 Handoff triggered — Score: ${msg.payload.score}`);
        updateScore(msg.payload.score);
      }
      else if (msg.type === 'CALL_ENDING') {
        addSys(`📴 Call ending — Score: ${msg.payload.score}`);
        updateScore(msg.payload.score);
      }
      else if (msg.type === 'CALL_ENDED') {
        addSys('📴 Call ended');
        if (msg.payload) {
          updateScore(msg.payload.final_score || 0);
          if (msg.payload.summary) showSummary(msg.payload.summary);
        }
        callActive = false;
        resetUI();
      }
      else if (msg.type === 'CALL_SUMMARY') {
        showSummary(msg.payload);
      }
      else if (msg.type === 'ERROR') {
        addSys('❌ ' + msg.payload);
      }
    };

    ws.onerror = () => { setStatus('🔴 Connection error', 'disconnected'); };
    ws.onclose = () => {
      setStatus('⚫ Disconnected', 'disconnected');
      callActive = false;
      resetUI();
    };
  });

  endBtn.addEventListener('click', () => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'END_CALL' }));
      addSys('Ending call...');
      stopRecording();
    }
  });

  function resetUI() {
    startBtn.disabled = false;
    endBtn.disabled = true;
    audioQueue.length = 0;
    audioPlaying = false;
    stopRecording();
    if (!callActive) setStatus('⚫ Disconnected', 'disconnected');
  }
</script>
</body>
</html>
