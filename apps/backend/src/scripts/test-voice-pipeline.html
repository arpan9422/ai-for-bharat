<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Pipeline Test - LangGraph</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    .container {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #667eea;
      text-align: center;
      margin-bottom: 10px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 600;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #startCall {
      background: #10b981;
      color: white;
    }
    #startCall:hover:not(:disabled) {
      background: #059669;
      transform: translateY(-2px);
    }
    #startRecording {
      background: #3b82f6;
      color: white;
    }
    #startRecording:hover:not(:disabled) {
      background: #2563eb;
      transform: translateY(-2px);
    }
    #stopRecording {
      background: #ef4444;
      color: white;
    }
    #stopRecording:hover:not(:disabled) {
      background: #dc2626;
      transform: translateY(-2px);
    }
    #endCall {
      background: #f59e0b;
      color: white;
    }
    #endCall:hover:not(:disabled) {
      background: #d97706;
      transform: translateY(-2px);
    }
    .status {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .status.connected {
      background: #d1fae5;
      color: #065f46;
      border-left: 4px solid #10b981;
    }
    .status.disconnected {
      background: #fee2e2;
      color: #991b1b;
      border-left: 4px solid #ef4444;
    }
    .status.recording {
      background: #dbeafe;
      color: #1e40af;
      border-left: 4px solid #3b82f6;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .log {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 15px;
      height: 400px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .log-entry {
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 4px;
      line-height: 1.5;
    }
    .log-entry.greeting {
      background: #fef3c7;
      border-left: 3px solid #f59e0b;
    }
    .log-entry.transcript {
      background: #dbeafe;
      border-left: 3px solid #3b82f6;
    }
    .log-entry.audio {
      background: #d1fae5;
      border-left: 3px solid #10b981;
    }
    .log-entry.error {
      background: #fee2e2;
      border-left: 3px solid #ef4444;
      color: #991b1b;
    }
    .log-entry.system {
      background: #f3f4f6;
      border-left: 3px solid #6b7280;
      color: #4b5563;
    }
    .lead-profile {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .lead-profile h3 {
      margin-top: 0;
      color: #667eea;
      font-size: 16px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      font-size: 14px;
      color: #374151;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎙️ Voice Pipeline Test</h1>
    <p class="subtitle">LangGraph-based Conversation Pipeline</p>

    <div class="lead-profile">
      <h3>Lead Profile (Optional)</h3>
      <div class="form-row">
        <div class="form-group">
          <label for="leadId">Lead ID:</label>
          <input type="text" id="leadId" placeholder="lead-12345" value="">
        </div>
        <div class="form-group">
          <label for="leadName">Name:</label>
          <input type="text" id="leadName" placeholder="Rajesh Kumar">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="leadOccupation">Occupation:</label>
          <select id="leadOccupation">
            <option value="">Select...</option>
            <option value="MFD">MFD</option>
            <option value="distributor">Distributor</option>
            <option value="insurance agent">Insurance Agent</option>
            <option value="sub-broker">Sub-Broker</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="leadLanguage">Language:</label>
          <select id="leadLanguage">
            <option value="hinglish">Hinglish</option>
            <option value="hindi">Hindi</option>
            <option value="english">English</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="leadBackground">Background:</label>
        <input type="text" id="leadBackground" placeholder="Financial services">
      </div>
    </div>

    <div id="status" class="status disconnected">
      ⚫ Disconnected
    </div>

    <div class="controls">
      <button id="startCall">📞 Start Call</button>
      <button id="endCall" disabled>📴 End Call</button>
    </div>

    <div class="log" id="log"></div>

    <div style="text-align: center; color: #6b7280; font-size: 12px;">
      <p>WebSocket: ws://localhost:4000/ws/voice-pipeline</p>
      <p>Make sure your microphone is enabled and the backend is running</p>
    </div>
  </div>

  <script>
    let ws = null;
    let mediaRecorder = null;       // records user mic only (for STT)
    let mixedRecorder = null;        // records MIXED audio (user + agent) for call recording
    let audioContext = null;         // shared AudioContext for mixing
    let mixedDest = null;            // MediaStreamAudioDestinationNode — mixed output
    let micSource = null;            // user mic source node
    let callActive = false;
    let mediaStream = null;
    let mixedChunks = [];            // accumulates mixed recording chunks

    // ── Sequential audio queue — plays agent audio and routes it into the mix ──
    const audioQueue = [];
    let audioPlaying = false;

    function enqueueAudio(audioData, mimeType) {
      audioQueue.push({ audioData, mimeType });
      drainAudioQueue();
    }

    async function drainAudioQueue() {
      if (audioPlaying || audioQueue.length === 0) return;
      audioPlaying = true;
      const { audioData, mimeType } = audioQueue.shift();

      try {
        // Decode the agent audio buffer
        if (!audioContext) audioContext = new AudioContext();

        const arrayBuf = audioData.buffer.slice(audioData.byteOffset, audioData.byteOffset + audioData.byteLength);
        const decoded = await audioContext.decodeAudioData(arrayBuf);

        // Play through speakers AND route into the mixed recording
        const src = audioContext.createBufferSource();
        src.buffer = decoded;
        src.connect(audioContext.destination);       // → speakers (user hears agent)
        if (mixedDest) src.connect(mixedDest);       // → mixed recording

        src.onended = () => {
          audioPlaying = false;
          drainAudioQueue();
        };
        src.start();
      } catch (err) {
        // Fallback: plain Audio element (no mixing into recording)
        const blob = new Blob([audioData], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.onended = () => { URL.revokeObjectURL(url); audioPlaying = false; drainAudioQueue(); };
        audio.onerror = () => { URL.revokeObjectURL(url); audioPlaying = false; drainAudioQueue(); };
        audio.play().catch(() => { audioPlaying = false; drainAudioQueue(); });
      }
    }

    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');
    const startCallBtn = document.getElementById('startCall');
    const endCallBtn = document.getElementById('endCall');

    function log(message, type = 'system') {
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = `[${timestamp}] ${message}`;
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function updateStatus(text, className) {
      statusDiv.textContent = text;
      statusDiv.className = `status ${className}`;
    }

    function getLeadProfile() {
      const leadId = document.getElementById('leadId').value.trim();
      const name = document.getElementById('leadName').value.trim();
      const occupation = document.getElementById('leadOccupation').value;
      const language = document.getElementById('leadLanguage').value;
      const background = document.getElementById('leadBackground').value.trim();

      const profile = {
        lead_id: leadId || undefined,
        name: name || undefined,
        occupation: occupation || undefined,
        language: language || undefined,
        background: background || undefined,
      };

      // Return null if all fields are empty
      if (!leadId && !name && !occupation && !background) {
        return { profile: null, lead_id: null };
      }

      return { profile, lead_id: leadId || null };
    }

    async function startRecording() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        log('🎤 Microphone access granted', 'system');

        // ── Set up Web Audio mixing ──
        if (!audioContext) audioContext = new AudioContext();

        // Create a destination node that captures the mixed output
        mixedDest = audioContext.createMediaStreamDestination();

        // Route mic into the mix
        micSource = audioContext.createMediaStreamSource(mediaStream);
        micSource.connect(mixedDest);
        // Note: don't connect micSource to audioContext.destination — that would cause echo

        // Start mixed recorder (captures both mic + agent audio)
        mixedChunks = [];
        mixedRecorder = new MediaRecorder(mixedDest.stream, { mimeType: 'audio/webm;codecs=opus' });
        mixedRecorder.ondataavailable = (e) => { if (e.data.size > 0) mixedChunks.push(e.data); };
        mixedRecorder.start(500);

        // ── STT recorder — sends mic audio to Deepgram ──
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'audio/webm;codecs=opus' });
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
            const reader = new FileReader();
            reader.onload = () => {
              const base64 = btoa(String.fromCharCode(...new Uint8Array(reader.result)));
              ws.send(JSON.stringify({ type: 'AUDIO_CHUNK', payload: base64 }));
            };
            reader.readAsArrayBuffer(event.data);
          }
        };
        mediaRecorder.start(100);

        log('🎙️ Recording started - speak now!', 'system');
        updateStatus('🔴 Recording...', 'recording');

      } catch (error) {
        log(`❌ Microphone error: ${error.message}`, 'error');
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
      if (mixedRecorder && mixedRecorder.state === 'recording') mixedRecorder.stop();
      if (micSource) { micSource.disconnect(); micSource = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      log('⏹️ Recording stopped', 'system');
    }

    async function uploadMixedRecording() {
      if (!mixedChunks.length || !ws || ws.readyState !== WebSocket.OPEN) return;
      try {
        const blob = new Blob(mixedChunks, { type: 'audio/webm' });
        const arrayBuf = await blob.arrayBuffer();
        const base64 = btoa(String.fromCharCode(...new Uint8Array(arrayBuf)));
        ws.send(JSON.stringify({ type: 'MIXED_RECORDING', payload: base64 }));
        log('📼 Mixed recording uploaded', 'system');
      } catch (e) {
        log('⚠️ Could not upload mixed recording: ' + e.message, 'system');
      }
    }

    startCallBtn.addEventListener('click', async () => {
      try {
        log('Connecting to WebSocket...', 'system');
        ws = new WebSocket('ws://localhost:4000/ws/voice-pipeline');

        ws.onopen = async () => {
          log('✅ WebSocket connected', 'system');
          updateStatus('🟢 Connected', 'connected');

          // Send START_CALL message
          const { profile, lead_id } = getLeadProfile();
          const payload = {};
          if (profile) payload.leadProfile = profile;
          if (lead_id) payload.lead_id = lead_id;
          
          ws.send(JSON.stringify({
            type: 'START_CALL',
            payload
          }));
          log('📞 Call started' + (lead_id ? ` for lead: ${lead_id}` : profile ? ' with lead profile' : ''), 'system');

          callActive = true;
          startCallBtn.disabled = true;
          endCallBtn.disabled = false;
        };

        ws.onmessage = async (event) => {
          const msg = JSON.parse(event.data);
          
          if (msg.type === 'GREETING') {
            log(`🎉 Greeting: ${msg.payload}`, 'greeting');
            if (!mediaRecorder || mediaRecorder.state !== 'recording') {
              await startRecording();
            }
          }
          else if (msg.type === 'TRANSCRIPT') {
            log(`📝 Transcript: ${msg.payload}`, 'transcript');
          }
          else if (msg.type === 'FILLER_AUDIO') {
            const audioData = Uint8Array.from(atob(msg.payload), c => c.charCodeAt(0));
            enqueueAudio(audioData, 'audio/wav');
          }
          else if (msg.type === 'AUDIO_PLAY') {
            log('🔊 Audio chunk received', 'audio');
            const audioData = Uint8Array.from(atob(msg.payload), c => c.charCodeAt(0));
            enqueueAudio(audioData, 'audio/mpeg');
          }
          else if (msg.type === 'TURN_DONE') {
            log('✅ Turn complete', 'system');
          }
          else if (msg.type === 'HANDOFF_REQUIRED') {
            log(`🚨 HANDOFF TO RM - Reason: ${msg.payload.reason}`, 'error');
            log(`📊 Score: ${msg.payload.score}, Engagement: ${msg.payload.engagement}`, 'system');
          }
          else if (msg.type === 'CALL_ENDING') {
            log(`📴 Call ending - Reason: ${msg.payload.reason}`, 'system');
            log(`📊 Final Score: ${msg.payload.score}`, 'system');
          }
          else if (msg.type === 'ERROR') {
            log(`❌ Error: ${msg.payload}`, 'error');
          }
          else if (msg.type === 'CALL_ENDED') {
            log('📴 Call ended', 'system');
            if (msg.payload) {
              log(`📊 Stats - Turns: ${msg.payload.turn_count}, Score: ${msg.payload.final_score}, Engagement: ${msg.payload.engagement}`, 'system');
              if (msg.payload.handoff_occurred) {
                log('🚨 Handoff occurred during call', 'system');
              }
              if (msg.payload.summary) {
                const s = msg.payload.summary;
                log(`🏷️ Status: ${s.status} | Next Action: ${s.nextAction}`, 'system');
                if (s.keyPoints && s.keyPoints.length > 0) {
                  log('📋 Key Points:', 'system');
                  s.keyPoints.forEach(pt => log(`  • ${pt}`, 'system'));
                }
                if (s.objectionsRaised && s.objectionsRaised.length > 0) {
                  log(`⚠️ Objections: ${s.objectionsRaised.join(', ')}`, 'system');
                }
                if (s.statedIntent) {
                  log(`💬 Stated Intent: "${s.statedIntent}"`, 'transcript');
                }
                if (s.rmOpener) {
                  log(`🎯 RM Opener: "${s.rmOpener}"`, 'greeting');
                }
              }
            }
            callActive = false;
            resetUI();
          }
        };

        ws.onerror = (error) => {
          log(`❌ WebSocket error: ${error}`, 'error');
          updateStatus('🔴 Error', 'disconnected');
        };

        ws.onclose = () => {
          log('WebSocket disconnected', 'system');
          updateStatus('⚫ Disconnected', 'disconnected');
          callActive = false;
          resetUI();
        };

      } catch (error) {
        log(`❌ Failed to connect: ${error.message}`, 'error');
      }
    });

    endCallBtn.addEventListener('click', async () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        // Stop recording first, wait for final chunks, then upload mixed recording
        stopRecording();
        await new Promise(r => setTimeout(r, 600)); // wait for final recorder chunks
        await uploadMixedRecording();
        ws.send(JSON.stringify({ type: 'END_CALL' }));
        log('📴 Ending call...', 'system');
      }
    });

    function resetUI() {
      startCallBtn.disabled = false;
      endCallBtn.disabled = true;
      audioQueue.length = 0;
      audioPlaying = false;
      mixedChunks = [];
      mixedDest = null;
      stopRecording();
      updateStatus('⚫ Disconnected', 'disconnected');
    }
  </script>
</body>
</html>
